<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para el amor de mi vida FANIS💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #f5e8dc;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #5c4033;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #main-wrapper {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 100vh;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Panel del mensaje e historia */
    #text-panel {
      width: 45%;
      max-width: 420px;
      opacity: 0;
      transform: translateX(-30px);
      transition: opacity 1.8s ease, transform 1.8s ease;
      z-index: 10;
      padding: 20px;
      text-align: left;
    }

    #text-panel.show {
      opacity: 1;
      transform: translateX(0);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #8b3a3a;
      font-weight: normal;
    }

    p.poem {
      font-size: 0.98rem;
      line-height: 1.5;
      margin-bottom: 20px;
      color: #4a3328;
    }

    .counter-label {
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #7a5242;
    }

    #counter {
      font-size: 1.05rem;
      font-weight: bold;
      color: #b22222;
      line-height: 1.7;
      background: rgba(255, 255, 255, 0.5);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px dashed rgba(178, 34, 34, 0.35);
      display: inline-block;
      width: 100%;
    }

    .unit {
      font-weight: normal;
      font-size: 0.85rem;
      color: #5c4033;
      margin-right: 4px;
    }

    /* Contenedor del árbol */
    #tree-stage {
      width: 500px;
      height: 600px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition: left 2s cubic-bezier(0.25, 1, 0.5, 1), transform 2s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 5;
    }

    /* Animación: El árbol rueda/se desplaza hacia la derecha */
    #tree-stage.shift-right {
      left: 70%;
      transform: translateX(-50%) scale(0.95);
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    /* Ajuste para pantallas móviles */
    @media (max-width: 768px) {
      #main-wrapper {
        flex-direction: column-reverse;
        justify-content: flex-end;
        padding-top: 10px;
      }

      #tree-stage {
        position: relative;
        left: 0 !important;
        transform: none !important;
        width: 320px;
        height: 380px;
        margin-top: -30px;
        transition: transform 1.5s ease;
      }

      #tree-stage.shift-right {
        transform: translateY(0) scale(0.9) !important;
      }

      #text-panel {
        width: 90%;
        max-width: 100%;
        text-align: center;
        padding: 10px;
        transform: translateY(20px);
      }

      #text-panel.show {
        transform: translateY(0);
      }
    }

    /* Corazones cayendo */
    .falling-heart {
      position: absolute;
      pointer-events: none;
      z-index: 20;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg) scale(0.8);
        opacity: 0.9;
      }
      100% {
        transform: translateY(100vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div id="main-wrapper">
  <!-- Panel de Texto (Aparecerá a la izquierda) -->
  <div id="text-panel">
    <h1>Para el amor de mi vida:</h1>
    <p class="poem">
      Mi vida hermosa mi fanis chula, gracias por hacerme el hombre mas feliz del mundo, te amo con toda mi alma 💕
    </p>
    <div class="counter-label">Nuestro viaje juntos comenzó hace...</div>
    <div id="counter">Cargando tiempo juntos...</div>
  </div>

  <!-- Escenario del Árbol (Inicia centrado y se desplaza a la derecha) -->
  <div id="tree-stage">
    <canvas id="treeCanvas" width="500" height="600"></canvas>
  </div>
</div>

<script>
  const canvas = document.getElementById('treeCanvas');
  const ctx = canvas.getContext('2d');
  const treeStage = document.getElementById('tree-stage');
  const textPanel = document.getElementById('text-panel');

  // Fecha de inicio: 8 de octubre de 2022
  const startDate = new Date('2022-10-08T00:00:00');

  // Dibuja corazones individuales en el canvas
  function drawHeart(x, y, size, color) {
    ctx.save();
    ctx.beginPath();
    ctx.translate(x, y);
    ctx.scale(size / 10, size / 10);
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-5, -5, -10, 0, -10, 5);
    ctx.bezierCurveTo(-10, 10, 0, 15, 0, 20);
    ctx.bezierCurveTo(0, 15, 10, 10, 10, 5);
    ctx.bezierCurveTo(10, 0, 5, -5, 0, 0);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  // Tronco y ramas
  function drawTrunk() {
    ctx.lineWidth = 12;
    ctx.strokeStyle = '#5c4033';
    ctx.lineCap = 'round';

    // Tronco principal
    ctx.beginPath();
    ctx.moveTo(250, 580);
    ctx.bezierCurveTo(250, 480, 240, 420, 250, 350);
    ctx.stroke();

    // Ramas
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(250, 400);
    ctx.bezierCurveTo(220, 360, 180, 340, 150, 310);
    ctx.moveTo(250, 380);
    ctx.bezierCurveTo(280, 340, 320, 320, 350, 290);
    ctx.moveTo(250, 360);
    ctx.bezierCurveTo(240, 310, 250, 280, 250, 240);
    ctx.stroke();
  }

  // Generación de copa de corazones
  const hearts = [];
  const colors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#ffb3c1', '#ff0054', '#fb6f92', '#ffe5ec'];

  function createBloom() {
    const totalHearts = 360;
    for (let i = 0; i < totalHearts; i++) {
      const t = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()); 
      
      let hx = 16 * Math.pow(Math.sin(t), 3);
      let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

      hx *= r * 11;
      hy *= r * 11;

      hearts.push({
        x: 250 + hx,
        y: 220 + hy,
        size: Math.random() * 8 + 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        delay: Math.random() * 2200,
        currentSize: 0
      });
    }
  }

  // Animación del brote
  let startTime = null;
  function animateTree(timestamp) {
    if (!startTime) startTime = timestamp;
    const progress = timestamp - startTime;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawTrunk();

    let bloomedCount = 0;
    hearts.forEach(h => {
      if (progress > h.delay) {
        if (h.currentSize < h.size) {
          h.currentSize += 0.4;
        }
        drawHeart(h.x, h.y, h.currentSize, h.color);
        bloomedCount++;
      }
    });

    if (bloomedCount < hearts.length || progress < 2500) {
      requestAnimationFrame(animateTree);
    } else {
      // Al terminar de florecer, desplaza el árbol a la derecha e ingresa el texto
      setTimeout(() => {
        treeStage.classList.add('shift-right');
        setTimeout(() => {
          textPanel.classList.add('show');
          startFallingHearts();
        }, 800);
      }, 400);
    }
  }

  // Lluvia suave de corazones
  function startFallingHearts() {
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'falling-heart';
      heart.innerText = ['🌸', '💖', '💕', '✨', '🌺'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
      heart.style.fontSize = (Math.random() * 10 + 12) + 'px';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 7000);
    }, 450);
  }

  // Contador en tiempo real
  function updateCounter() {
    const now = new Date();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById('counter').innerHTML = `
      ${days} <span class="unit">días</span> 
      ${hours} <span class="unit">horas</span> 
      ${minutes} <span class="unit">minutos</span> 
      ${seconds} <span class="unit">segundos</span>
    `;
  }

  // Ejecución
  createBloom();
  requestAnimationFrame(animateTree);
  setInterval(updateCounter, 1000);
  updateCounter();
</script>

</body>
</html>
